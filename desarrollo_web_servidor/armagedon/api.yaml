openapi: 3.0.4
info:
  title: API de Armagedón
  version: 1.0.0
  contact:
    name: Desarrollos Apocalípticos, S.A.
    email: programadores_daw@apocalipsis.com
  
servers: 
  - url: https://www.telearmagedon.com/api/v1
    description: Servidor de producción
  - url: https://www.desarrollo.telearmagedon.com/api/v1
    description: Servidor de desarrollo
  
paths: 
  /armagedon/:
    get:
      summary: Obtener la lista completa de Armagedones.
      responses: 
        '200':
          description: Lista obtenida correctamente.
          content: 
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: 
                      type: integer 
                      description: Identificador de identidad
                    título:
                      type: string
                      description: Título de la entidad