<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplos Bootstrap</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <h1>Ejemplos de Bootstrap</h1>
        
        <div class="seccion">
            <h2>Orden de elementos</h2>
            <div class="ejemplo">
                <div class="caja orden-1">A</div>
                <div class="caja orden-2">B</div>
                <div class="caja orden-3">C</div>
            </div>
        </div>

        <div class="seccion">
            <h2>Mostrar/Ocultar elementos</h2>
            <div class="ejemplo">
                <div class="caja movil">Solo móvil</div>
                <div class="caja tablet">Solo tablet</div>
                <div class="caja escritorio">Solo escritorio</div>
            </div>
        </div>

        <div class="seccion">
            <h2>Tamaños de pantalla</h2>
            <div class="info">
                <p>XS: menos de 576px</p>
                <p>SM: 576px a 768px</p>
                <p>MD: 768px a 992px</p>
                <p>LG: 992px a 1200px</p>
                <p>XL: más de 1200px</p>
            </div>
        </div>
    </div>
</body>
</html>
