<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout con HTML5 y CSS Grid</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Encabezado de la página con navegación -->
    <header>
        <div class="header-content">header</div>
        <nav>nav</nav>
    </header>

    <!-- Contenedor principal con Grid -->
    <div class="main-container">
        <!-- Artículo principal con secciones -->
        <article>
            <div class="article-title">article</div>
            <section>section</section>
            <section>section</section>
            <section>section</section>
        </article>

        <!-- Barra lateral -->
        <aside>aside</aside>
    </div>

    <!-- Pie de página -->
    <footer>
        footer
    </footer>
</body>
</html>
