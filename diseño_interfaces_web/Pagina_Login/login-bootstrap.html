<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles-bootstrap.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="login-box bg-white p-4 rounded">
            <h1 class="text-center mb-4">Iniciar Sesión</h1>
            
            <form action="#" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            
            <p class="text-center mt-3">¿No tienes cuenta? <a href="#">Regístrate</a></p>
        </div>
    </div>

    <script>
        var contador = 0;
        var valormaximo = 3;
        var imagenes = [
            "https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?w=1920",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920",
            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920"
        ];
        
        function cambiafondo() {
            if (contador >= valormaximo) {
                contador = 0;
            }
            document.body.style.backgroundImage = "url('" + imagenes[contador] + "')";
            contador++;
        }
        
        cambiafondo();
        setInterval(cambiafondo, 10000);
    </script>
</body>
</html>
