<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CSS Grid y Flexbox</title>
    <link rel="stylesheet" href="styles-grid.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1>Iniciar Sesión</h1>
            
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit">Entrar</button>
            </form>
            
            <p>¿No tienes cuenta? <a href="#">Regístrate</a></p>
        </div>
    </div>

    <script>
        var contador = 0;
        var valormaximo = 3;
        var imagenes = [
            "https://images.unsplash.com/photo-1557683316-973673baf926?w=1920",
            "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1920",
            "https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=1920"
        ];
        
        function cambiafondo() {
            if (contador >= valormaximo) {
                contador = 0;
            }
            document.body.style.backgroundImage = "url('" + imagenes[contador] + "')";
            contador++;
        }
        
        cambiafondo();
        setInterval(cambiafondo, 10000);
    </script>
</body>
</html>
