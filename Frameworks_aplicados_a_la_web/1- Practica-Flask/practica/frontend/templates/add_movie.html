{% extends "base.html" %}
{% block title %}Añadir Película - CineFlask{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <h1><i class="fas fa-plus-circle me-2"></i>Añadir Nueva Película</h1>
        
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="title" class="form-label">Título *</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="director" class="form-label">Director *</label>
                            <input type="text" class="form-control" id="director" name="director" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="year" class="form-label">Año *</label>
                            <input type="number" class="form-control" id="year" name="year" min="1900" max="2025" required>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="genre" class="form-label">Género *</label>
                            <select class="form-control" id="genre" name="genre" required>
                                <option value="">Selecciona un género</option>
                                <option value="Acción">Acción</option>
                                <option value="Comedia">Comedia</option>
                                <option value="Drama">Drama</option>
                                <option value="Terror">Terror</option>
                                <option value="Ciencia Ficción">Ciencia Ficción</option>
                                <option value="Romance">Romance</option>
                                <option value="Aventura">Aventura</option>
                            </select>
                        </div>
                        
                        <div class="col-md-4 mb-3">
                            <label for="rating" class="form-label">Puntuación (0-10) *</label>
                            <input type="number" class="form-control" id="rating" name="rating" min="0" max="10" step="0.1" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="poster_url" class="form-label">URL del Póster *</label>
                        <input type="url" class="form-control" id="poster_url" name="poster_url" placeholder="https://ejemplo.com/poster.jpg" required>
                        <small class="text-muted">Introduce la URL de la imagen del póster de la película</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Descripción *</label>
                        <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Guardar Película
                        </button>
                        <a href="{{ url_for('movies') }}" class="btn btn-secondary">
                            <i class="fas fa-times me-2"></i>Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
